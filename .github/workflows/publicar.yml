name: Actualizar datos y publicar

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # FASE DE MEDICIÓN (1-2 fines de semana): ver a qué horas publica la federación los resultados.
    # Horas en UTC; en Álava +1 en invierno (+2 en verano).
    - cron: '13 7-23/2 * * 6,0'    # sábado y domingo: cada 2 horas (08:13 a 00:13 en invierno)
    - cron: '13 7-22/3 * * 1'      # lunes: cada 3 horas

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Leer basketaraba.com y generar los datos
        run: node scraper/actualizar.mjs dist
      - name: Añadir la app
        run: cp -r app/. dist/ && touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v5
